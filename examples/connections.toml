# poste-redis manual-test connection config
# Start the local redis: cd playground && docker compose up -d
# Open any examples/*.redis, put the cursor on a command line and hit <CR>;
# :PosteRedisRunFile runs the whole file

[local]
dialect = "redis"
url = "redis://127.0.0.1:16479/0"
color = "MiniStatuslineModeReplace"

[local-db2]
dialect = "redis"
url = "redis://127.0.0.1:16479/1"
color = "MiniStatuslineModeOther"

# Field-by-field form (composed when url is absent) — uncomment to enable
# [local-fields]
# dialect = "redis"
# host = "127.0.0.1"
# port = 16479
# db = 0

# Password example ({{REDIS_PASS}} expands from .env / environment; the
# password never reaches logs)
# [secure]
# dialect = "redis"
# host = "127.0.0.1"
# port = 16379
# password = "{{REDIS_PASS}}"
